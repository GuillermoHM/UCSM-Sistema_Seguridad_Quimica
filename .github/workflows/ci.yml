name: CI Pipeline - Laboratorio UCSM

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-ci:
    name: Backend Lint, Test & Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias backend
        run: npm ci

      - name: Ejecutar Linter (Clean Code)
        run: npm run lint --if-present

      - name: Ejecutar pruebas unitarias
        run: npm test --if-present
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'dummy_anon_key' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'dummy_jwt_secret' }}

  frontend-ci:
    name: Frontend Build & Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Validar compilación (Build check)
        run: npm run build --if-present